<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#7a1f1c">
<title>Conteo Casa Marana</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<style>
  :root { --navy:#7a1f1c; --ink:#1d2733; --muted:#5d6b7a; --line:#dde3ea; --bg:#f4f6f9; --card:#fff; --ok:#1e7a4a; --warn:#b26a00; --bad:#b3261e; --chip:#e8eef5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:5; background:var(--navy); color:#fff; padding:10px 14px 8px; padding-top:calc(10px + env(safe-area-inset-top,0px)); }
  header h1 { margin:0; font-size:17px; font-weight:700; letter-spacing:.4px; line-height:1.1; }
  header .sub { font-size:12px; opacity:.85; }
  .brand { display:flex; gap:10px; align-items:center; flex:1; }
  .brand img { width:42px; height:42px; border-radius:50%; background:#fff; object-fit:contain; padding:2px; }
  .loginlogo { display:block; width:110px; height:110px; margin:0 auto 6px; object-fit:contain; }
  .loginname { font-size:26px; font-weight:800; letter-spacing:3px; color:var(--navy); text-align:center; margin:6px 0 14px; }
  .semana { font-size:12px; opacity:.9; }
  input[type=date] { font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:#fff; color:var(--ink); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .top { margin-top:8px; }
  select, input[type=text], input[type=search], input[type=password] { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); }
  header select, header input { padding:6px 8px; font-size:14px; }
  .lang { border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; border-radius:14px; padding:4px 10px; font:inherit; font-size:12px; font-weight:700; letter-spacing:.5px; }
  .lang.dark { border-color:var(--line); color:var(--navy); float:right; }
  .bar { height:6px; background:rgba(255,255,255,.25); border-radius:3px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; width:0; background:#7fd3a3; transition:width .3s; }
  .prog { font-size:12px; opacity:.9; margin-top:4px; display:flex; justify-content:space-between; }
  .filters { background:#fff; border-bottom:1px solid var(--line); padding:8px 14px; position:sticky; top:var(--hh,108px); z-index:4; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .chip { flex:0 0 auto; border:0; border-radius:16px; padding:6px 12px; background:var(--chip); color:var(--navy); font:inherit; font-size:13px; font-weight:600; }
  .chip[aria-pressed=true] { background:var(--navy); color:#fff; }
  .filters .row { margin-top:6px; }
  #q { flex:1; min-width:140px; }
  label.sw { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  main { padding:8px 10px 110px; }
  .grp { margin:14px 4px 6px; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; }
  .card.done { border-color:#b9dcc7; }
  .name { font-weight:600; }
  .meta { font-size:12px; color:var(--muted); margin-top:1px; display:flex; justify-content:space-between; gap:8px; }
  .st { font-size:12px; font-weight:600; white-space:nowrap; }
  .st.ok { color:var(--ok); } .st.wait { color:var(--warn); } .st.err { color:var(--bad); }
  .fields { display:grid; grid-template-columns:repeat(auto-fit, minmax(92px,1fr)); gap:8px; margin-top:8px; }
  .f span { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
  .step { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .step button { width:34px; border:0; background:var(--chip); color:var(--navy); font-size:18px; font-weight:700; }
  .step input { width:100%; min-width:0; border:0; text-align:center; font:inherit; font-size:17px; font-variant-numeric:tabular-nums; padding:7px 2px; }
  .step input:focus { outline:2px solid #7aa7d6; outline-offset:-2px; }
  footer { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center; z-index:6; }
  footer .info { flex:1; font-size:12px; color:var(--muted); }
  .btn { border:0; border-radius:10px; padding:11px 16px; font:inherit; font-weight:650; background:var(--navy); color:#fff; }
  .btn:disabled { opacity:.5; }
  #login { max-width:360px; margin:60px auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
  #login h2 { margin:0 0 4px; font-size:18px; }
  #login p { margin:0 0 14px; color:var(--muted); font-size:13px; }
  #login input { width:100%; margin-bottom:10px; }
  .msg { padding:10px 12px; border-radius:10px; margin:10px 4px; font-size:13px; }
  .msg.err { background:#fdecea; color:var(--bad); } .msg.ok { background:#e7f5ec; color:var(--ok); }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  [hidden] { display:none !important; }
  .scan { position:fixed; inset:0; z-index:20; background:#000; display:flex; flex-direction:column; }
  .scan #reader { width:100%; margin:auto 0; background:#000; }
  .scan #reader video { object-fit:cover; }
  .scanbar { background:#111; color:#fff; padding:12px 14px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center; }
  .scanbar span { flex:1 1 100%; font-size:14px; }
  .scanbar { flex-wrap:wrap; }
  .scanbar .btn { flex:1; text-align:center; }
  .btn.light { background:#fff; color:var(--navy); }
  .sheet { position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .sheetin { background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)); }
  .sheetin h3 { margin:2px 4px 8px; font-size:16px; }
  .sheetin p { margin:4px 4px 10px; color:var(--muted); font-size:13px; }
  .pick { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; margin:6px 0; font:inherit; }
  .pick small { display:block; color:var(--muted); font-size:12px; }
  .sheetbtns { display:flex; gap:10px; margin-top:12px; }
  .sheetbtns .btn { flex:1; }
  .code { font-family:ui-monospace,Menlo,monospace; }
  @media (min-width:720px) {
    main { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:12px; max-width:1200px; margin:0 auto; }
    main .grp, main .empty { grid-column:1 / -1; }
    .filters .row, .filters .chips { max-width:1200px; margin-left:auto; margin-right:auto; }
  }
  @media (min-width:1100px) { main { grid-template-columns:repeat(3, minmax(0,1fr)); } }
</style>
</head>

function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function cargar(fecha) {
  $('entrar').disabled = true;
  api('datos', { pin: S.pin, dia: fecha || S.dia || hoyISO() }).then(d => {
    $('entrar').disabled = false;
    const ya = new Set(d.productos.map(p => p[0]));
    const propios = misNuevos().filter(n => !ya.has(n.p[0]));
    S.productos = d.productos.concat(NUEVOS.filter(n => !ya.has(n[0])).map(n => n.slice(0, 6)), propios.map(n => n.p)).map(corregir).map(enIngles);
    S.cap = d.capturas || {}; S.codigos = d.codigos || {};
    NUEVOS.concat(propios.map(n => n.p.concat(n.codigo || ''))).forEach(n => { const c = limpio(n[6]); if (c && !S.codigos[c]) S.codigos[c] = [n[0]]; });
    // los que ya llegaron a la hoja Productos se quitan de la lista local; los demás se reintentan
    guardarNuevos(misNuevos().filter(n => !ya.has(n.p[0]))); subirNuevos();
    // altas de la app que resultaron ser un producto que ya existía: se esconden y su código apunta al bueno
    S.productos = S.productos.filter(p => !ALIAS[p[0]]);
    for (const a in ALIAS) if (S.cap[a] && !S.cap[ALIAS[a]]) S.cap[ALIAS[a]] = S.cap[a];
    for (const c in S.codigos) S.codigos[c] = [...new Set(S.codigos[c].map(i => ALIAS[i] || i))];
    Object.assign(S.codigos, CODIGO_FIJO);
    S.fecha = d.semana; if (!S.dia) S.dia = d.dia;
    // una sola vez: St. Francis se contó el 19-oct como LIC-0419 (que es Woodford Double Oaked) → LIC-0425
    if (!ls.get('cm_mig0419')) { const l19 = capLocal('2026-10-19'); if (l19['LIC-0419'] && !l19['LIC-0425']) { l19['LIC-0425'] = l19['LIC-0419']; delete l19['LIC-0419']; ls.set('cm_cap|2026-10-19', JSON.stringify(l19)); } ls.set('cm_mig0419', '1'); }
    const loc = capLocal(S.fecha); for (const id in loc) if (!S.cap[id] && !ALIAS[id]) S.cap[id] = loc[id];
    $('fecha').value = S.dia; $('semana').textContent = T[L].week(fmt(S.fecha));
    try { Object.assign(S.cola, JSON.parse(ls.get('cm_cola') || '{}')); } catch(e) {}

}

function armarFiltros() {

  });

  $('area').innerHTML = `<option value="">${t('allAreas')}</option>` + areas.map(x => `<option value="${esc(x)}"${x === S.area ? ' selected' : ''}>${esc(areaName(x))}</option>`).join('');
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function contado(id){ const c = S.cap[id]; return !!c && [c[0],c[1],c[2]].some(v => v !== '' && v !== null && v !== undefined); }

function pintar() {
  const Lst = $('lista'); Lst.innerHTML = '';
  const vis = S.productos.filter(p => (!S.mod || p[1] === S.mod) && (!S.area || p[2] === S.area)
      && coincide(p, S.q) && (!S.solo || !contado(p[0])));
  if (!vis.length) { Lst.innerHTML = `<div class="empty">${t('nothing')}</div>`; progreso(); return; }
  let grupo = null; const frag = document.createDocumentFragment();
  vis.slice(0, 400).forEach(p => {
    const g = modName(p[1]) + ' · ' + areaName(p[2]);
    if (g !== grupo) { grupo = g; const h = document.createElement('div'); h.className = 'grp'; h.textContent = g; frag.appendChild(h); }
    frag.appendChild(tarjeta(p));
  });
  Lst.appendChild(frag);

function tarjeta(p) {

function cambio(id, d) {

  if (vals[2] !== '' && (+vals[2] < 0 || (+vals[2] > 10 && !sinTope(id)))) { marca(id, 'err', 'openRange'); return; }

function marca(id, cls, key) {

function enviar(k) {

  });
}
setInterval(() => { Object.keys(S.cola).forEach(enviar); }, 15000);
window.addEventListener('online', () => Object.keys(S.cola).forEach(enviar));

function progreso() {
  const total = S.productos.length, hechos = S.productos.filter(p => contado(p[0])).length;
  $('prog').textContent = T[L].counted(hechos, total);
  const pend = Object.keys(S.cola).length; $('pend').textContent = pend ? T[L].toSend(pend) : t('allSent');
  $('barra').style.width = (total ? 100 * hechos / total : 0) + '%';
}
function medir(){ document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'); }
window.addEventListener('resize', medir);

$('fin').onclick = () => {
  const pend = Object.keys(S.cola).length;
  if (pend) { $('finfo').textContent = T[L].pending(pend); Object.keys(S.cola).forEach(enviar); return; }
  $('fin').disabled = true; $('finfo').textContent = t('sending');
  api('terminar', { pin: S.pin, fecha: S.fecha })
    .then(n => { $('fin').disabled = false; $('finfo').textContent = T[L].finished(n); })
    .catch(e => { $('fin').disabled = false; $('finfo').textContent = t('failed') + errTxt(e); });
};
/* ---------------- escáner de códigos ---------------- */
let lector = null, leyendo = false;
// Etiquetas de caja GS1-128: "(01)" + GTIN-14 + lote/fecha → nos quedamos con el GTIN
const limpio = c => { let d = String(c || '').replace(/^\][A-Za-z]\d/, '').replace(/\D/g, ''); if (d.length >= 16 && d.startsWith('01')) d = d.slice(2, 16); return d.replace(/^0+/, ''); };
const digito = b => { let s = 0; b.split('').reverse().forEach((x, i) => s += +x * (i % 2 ? 1 : 3)); return String((10 - s % 10) % 10); };
function buscarUno(s, m) {
  if (m[s]) return m[s];
  if (s.length > 7 && m[s.slice(0, -1)]) return m[s.slice(0, -1)];          // Square guardó el código sin el dígito verificador
  for (const k in m) if (k.slice(0, -1) === s) return m[k];               // al revés
  return null;
}
function buscarCodigo(raw) {
  const s = limpio(raw), m = S.codigos || {};
  if (!s) return [];
  const r = buscarUno(s, m); if (r) return r;
  // código de caja (GTIN-14 / ITF-14): probar con el código de la pieza que trae adentro
  const g = s.padStart(14, '0');
  if (s.length >= 13 && g[0] !== '0') { const u = (g.slice(1, 13) + digito(g.slice(1, 13))).replace(/^0+/, ''); const r2 = buscarUno(u, m); if (r2) return r2; }
  return [];
}
function producto(id) { return S.productos.find(p => p[0] === id); }
async function abrirEscaner() {
  if (!window.Html5Qrcode) { $('finfo').textContent = t('noLib'); return; }
  $('scan').hidden = false; $('scanmsg').textContent = t('aim');
  const F = Html5QrcodeSupportedFormats;
  if (!lector) lector = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.CODE_93, F.CODABAR, F.RSS_14, F.RSS_EXPANDED], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  try {
    await lector.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.94), height: Math.floor(Math.min(h * 0.4, 190)) }), aspectRatio: 1.333 },
      txt => { if (!leyendo) return; leyendo = false; if (navigator.vibrate) navigator.vibrate(60); cerrarEscaner().then(() => resultado(txt)); }, () => {});
    leyendo = true;
  } catch (e) { $('scanmsg').textContent = t('noCam'); }
  $('fotobtn').hidden = false;
}
async function cerrarEscaner() {
  leyendo = false;
  try { if (lector && lector.isScanning) await lector.stop(); } catch (e) {}
  $('scan').hidden = true;
}
function hoja(html) { $('sheetin').innerHTML = html; $('sheet').hidden = false; }
function cerrarHoja() { $('sheet').hidden = true; $('sheetin').innerHTML = ''; pintar(); }
function resultado(raw) {
  const ids = buscarCodigo(raw).filter(id => producto(id) && producto(id)[1] !== 'Barril');   // los barriles no se escanean
  if (ids.length === 1) return mostrar(ids[0]);
  if (ids.length > 1) {
    hoja(`<h3>${esc(t('choose'))}</h3><p class="code">${esc(raw)}</p>` +
      ids.map(id => { const p = producto(id); return `<button class="pick" data-id="${esc(id)}">${esc(p[3])}<small>${esc([p[4], id].filter(Boolean).join(' · '))}</small></button>`; }).join('') +
      `<div class="sheetbtns"><button class="btn light" id="sh_scan" style="border:1px solid var(--navy)">${esc(t('another'))}</button></div>`);
    $('sheetin').querySelectorAll('.pick').forEach(b => b.onclick = () => mostrar(b.dataset.id));
    $('sh_scan').onclick = () => { cerrarHoja(); abrirEscaner(); };
    return;
  }
  hoja(`<h3>${esc(t('newCode'))}: <span class="code">${esc(raw)}</span></h3><p>${esc(t('newCodeSub'))}</p>
    <input id="sh_q" type="search" placeholder="${esc(t('searchP'))}" style="width:100%">
    <div id="sh_list"></div>
    <button class="btn light" id="sh_new" style="width:100%;margin-top:6px;border:1px dashed var(--navy)">${esc(t('notListed'))}</button>
    <div class="sheetbtns"><button class="btn light" id="sh_scan" style="border:1px solid var(--navy)">${esc(t('another'))}</button><button class="btn" id="sh_close">${esc(t('ready'))}</button></div>`);
  const lista = () => {
    const q = $('sh_q').value.trim();
    const vis = S.productos.filter(p => p[1] !== 'Barril' && coincide(p, q)).slice(0, 30);
    $('sh_list').innerHTML = vis.map(p => `<button class="pick" data-id="${esc(p[0])}">${esc(p[3])}<small>${esc([modName(p[1]), p[4], p[0]].filter(Boolean).join(' · '))}</small></button>`).join('');
    $('sh_list').querySelectorAll('.pick').forEach(b => b.onclick = () => aprender(raw, b.dataset.id));
  };
  $('sh_q').oninput = lista; lista(); $('sh_q').focus();
  $('sh_new').onclick = () => formNuevo(raw, $('sh_q').value.trim());
  $('sh_scan').onclick = () => { cerrarHoja(); abrirEscaner(); };
  $('sh_close').onclick = cerrarHoja;
}
/* ---------------- dar de alta un producto que no está en la lista ---------------- */
// Se guarda en este teléfono (cm_nuevos) hasta que la hoja Productos lo confirma; así se puede contar aunque no haya señal.
const PREF = { Licor: 'LIC', Latas: 'LAT', Mixer: 'MIX', Comida: 'COM' };
const UNIDAD = { Licor: 'botella', Latas: 'lata/botella', Mixer: 'botella', Comida: 'pieza' };
// tipos de licor = categorías de Square/05; se guarda junto al tamaño ("750 ml · Vodka") para no cambiar la hoja Productos
const TIPOS = [['Vodka', 'Vodka'], ['Tequila/Mezcal', 'Tequila / Mezcal'], ['Whiskey/Scotch', 'Whiskey / Bourbon / Scotch'], ['Rum', 'Ron (Rum)'], ['Gin', 'Gin'], ['Cordials', 'Licor / Cordial / Schnapps'], ['Brandy/Cognac', 'Brandy / Cognac'], ['Vermouth/Aperitivo', 'Vermut / Aperitivo'], ['Wine', 'Vino'], ['Otro', 'Otro']];
function misNuevos() { try { return JSON.parse(ls.get('cm_nuevos') || '[]'); } catch (e) { return []; } }
function guardarNuevos(a) { ls.set('cm_nuevos', JSON.stringify(a)); }
function subirNuevos() {
  misNuevos().forEach(n => {
    const [id, modulo, area, nombre, tamano, unidad] = n.p;
    api('nuevo', { pin: S.pin, id, modulo, area, nombre, tamano, unidad, codigo: n.codigo || '', quien: S.quien })
      .then(() => guardarNuevos(misNuevos().filter(x => x.p[0] !== id)))
      .catch(() => {});   // se reintenta al volver a entrar o con el reloj de abajo
  });
}
setInterval(() => { if (S.pin && misNuevos().length) subirNuevos(); }, 60000);
function formNuevo(raw, nombre) {
  const c = limpio(raw || ''), mod = PREF[S.mod] ? S.mod : 'Licor';
  hoja(`<h3>${esc(t('newTitle'))}</h3><p>${esc(t('newSub'))}</p>
    ${c ? `<p>${esc(t('newCode'))}: <span class="code">${esc(c)}</span></p>` : ''}
    <input id="nv_nombre" type="text" placeholder="${esc(t('newName'))}" value="${esc(nombre || '')}" style="width:100%;margin-bottom:8px">
    <div class="row"><select id="nv_mod" aria-label="${esc(t('newType'))}">${Object.keys(PREF).map(m => `<option value="${m}"${m === mod ? ' selected' : ''}>${esc(modName(m))}</option>`).join('')}</select>
    <input id="nv_tam" type="text" placeholder="${esc(t('newSize'))}" style="flex:1"></div>
    <select id="nv_tipo" style="width:100%;margin-top:8px"><option value="">${esc(t('newKind'))}</option>${TIPOS.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
    <div id="nv_msg"></div><div id="nv_sim"></div>
    <div class="sheetbtns"><button class="btn light" id="nv_cancel" style="border:1px solid var(--navy)">${esc(t('cancel'))}</button><button class="btn" id="nv_ok">${esc(t('newSave'))}</button></div>`);
  const parecidos = () => {
    const q = $('nv_nombre').value.trim();
    const vis = q.length < 3 ? [] : S.productos.filter(p => p[1] !== 'Barril' && coincide(p, q)).slice(0, 6);
    $('nv_sim').innerHTML = vis.length ? `<p>${esc(t('newSimilar'))}</p>` + vis.map(p => `<button class="pick" data-id="${esc(p[0])}">${esc(p[3])}<small>${esc([modName(p[1]), p[4], p[0]].filter(Boolean).join(' · '))}</small></button>`).join('') : '';
    $('nv_sim').querySelectorAll('.pick').forEach(b => b.onclick = () => c ? aprender(c, b.dataset.id) : mostrar(b.dataset.id));
  };
  const verTipo = () => { $('nv_tipo').hidden = $('nv_mod').value !== 'Licor'; };
  $('nv_mod').onchange = verTipo; verTipo();
  $('nv_nombre').oninput = parecidos; parecidos(); $('nv_nombre').focus();
  $('nv_cancel').onclick = cerrarHoja;
  $('nv_ok').onclick = () => {
    const n = $('nv_nombre').value.trim().replace(/\s+/g, ' '), m = $('nv_mod').value;
    if (!n) { $('nv_msg').innerHTML = `<div class="msg err">${esc(t('newNeed'))}</div>`; return; }
    const tipo = m === 'Licor' ? $('nv_tipo').value : '';
    if (m === 'Licor' && !tipo) { $('nv_msg').innerHTML = `<div class="msg err">${esc(t('newKindNeed'))}</div>`; return; }
    const id = PREF[m] + '-N' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase();
    const p = [id, m, 'Alta en la app', n, [$('nv_tam').value.trim(), tipo].filter(Boolean).join(' · '), UNIDAD[m]];
    guardarNuevos(misNuevos().concat([{ p, codigo: c }]));
    S.productos.push(p);
    if (c) { (S.codigos[c] = S.codigos[c] || []).push(id); }
    armarFiltros(); mostrar(id); subirNuevos();
  };
}
$('nuevobtn').onclick = () => formNuevo('', $('q').value.trim());
function aprender(raw, id) {
  const s = limpio(raw);
  (S.codigos[s] = S.codigos[s] || []); if (S.codigos[s].indexOf(id) < 0) S.codigos[s].push(id);
  mostrar(id);
  api('aprender', { pin: S.pin, codigo: s, id, quien: S.quien }).then(m => { if (m) S.codigos = m; })
    .catch(e => { $('finfo').textContent = t('learnFail') + errTxt(e); });
}
function mostrar(id) {
  const p = producto(id); if (!p) return;
  hoja(`<div id="sh_card"></div><div class="sheetbtns"><button class="btn light" id="sh_scan" style="border:1px solid var(--navy)">${esc(t('another'))}</button><button class="btn" id="sh_close">${esc(t('ready'))}</button></div>`);
  $('sh_card').appendChild(tarjeta(p));
  const inp = $('sh_card').querySelector('input'); if (inp) setTimeout(() => { inp.focus(); inp.select && inp.select(); }, 250);
  $('sh_scan').onclick = () => { cerrarHoja(); abrirEscaner(); };
  $('sh_close').onclick = cerrarHoja;
}
$('scanbtn').onclick = abrirEscaner;
$('scanclose').onclick = cerrarEscaner;
$('foto').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !window.Html5Qrcode) return;
  try { if (lector && lector.isScanning) await lector.stop(); } catch (x) {}
  try { const txt = await lector.scanFile(f, false); leyendo = false; $('scan').hidden = true; resultado(txt); }
  catch (x) { $('scanmsg').textContent = t('photoFail'); }
};
$('sheet').onclick = e => { if (e.target === $('sheet')) cerrarHoja(); };

aplicarIdioma();
</script>
